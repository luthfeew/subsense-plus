<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#181e30"/>
    </linearGradient>

    <!-- Golden Neon Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 1   0.8 0 0 0 0.8   0 0 0 0 0  0 0 0 0.7 0"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow for icon -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" filter="url(#dropShadow)"/>

  <!-- Subtle Ambient Glow in background -->
  <circle cx="256" cy="230" r="140" fill="#FFD700" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Subtitle Screen/Card (Glassmorphism) -->
  <rect x="96" y="140" width="320" height="200" rx="36" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Shockwave / Jumpscare Pulse inside Subtitle Window -->
  <path d="M 136 240 L 190 240 L 214 186 L 246 294 L 274 210 L 298 258 L 320 240 L 376 240" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Subtitle Lower Line Text Representation -->
  <rect x="156" y="278" width="120" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="288" y="278" width="68" height="8" rx="4" fill="#FFD700" opacity="0.8"/>

  <!-- Mini Warning Triangle Icon at Bottom of Screen -->
  <g transform="translate(256, 308) scale(0.7)">
    <path d="M 0 -22 L 18 12 L -18 12 Z" fill="#FFD700" filter="url(#neonGlow)"/>
    <circle cx="0" cy="5" r="2" fill="#0b0d14"/>
    <rect x="-1.5" y="-12" width="3" height="11" rx="1.5" fill="#0b0d14"/>
  </g>

  <!-- Glowing Supercharged "+" Badge (SubSense+) -->
  <g transform="translate(382, 130)" filter="url(#goldGlow)">
    <!-- Plus Badge Circle -->
    <circle cx="0" cy="0" r="42" fill="url(#goldGrad)"/>
    <!-- Plus Inner Cross -->
    <path d="M -18 0 L 18 0 M 0 -18 L 0 18" stroke="#0b0d14" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
